name: Desktop packages
on:
  push:
    branches: [feature/desktop-v3]
  pull_request:
    branches: [develop-2.3, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-desktop.sh
      - name: Launch Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process target/desktop/StudySync/StudySync.exe -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Desktop app exited during startup ($($app.ExitCode))" }
          Stop-Process -Id $app.Id
      - name: Upload desktop app image
        uses: actions/upload-artifact@v4
        with:
          name: StudySync-3.0.0-rc.3-${{ runner.os }}
          path: target/desktop/
          if-no-files-found: error
