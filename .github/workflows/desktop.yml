name: Desktop packages
on:
  push:
    branches: [feature/desktop-v3, feature/desktop-design, main]
  pull_request:
    branches: [develop-2.3, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-desktop.ps1
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-desktop.sh
      - name: Test Windows native dialogs, accessibility metadata, and repeat launch
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/test-windows-dialogs.ps1
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/desktop/StudySync -DestinationPath target/StudySync-3.1.0-Windows.zip
      - name: Archive Linux application with executable permissions
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C target/desktop -czf target/StudySync-3.1.0-Linux.tar.gz StudySync
      - uses: actions/upload-artifact@v4
        with:
          name: StudySync-3.1.0-${{ runner.os }}
          path: |
            target/StudySync-3.1.0-Windows.zip
            target/StudySync-3.1.0-Linux.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: StudySync-3.1.0-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          [[ "$version" == "3.1.0" ]] || { echo "Not the stable 3.1.0 build"; exit 1; }
          (cd release-assets && sha256sum StudySync-* > SHA256SUMS.txt)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; its assets are left unchanged."
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "StudySync $version" --notes-file docs/RELEASE-NOTES.md release-assets/*
          fi
