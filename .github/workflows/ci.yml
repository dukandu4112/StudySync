name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop-2.3", "feature/desktop-v3", "feature/desktop-design" ]
  pull_request:
    branches: [ "main", "develop-2.3" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify build and tests
        run: mvn --batch-mode -Pdesktop-qa verify
